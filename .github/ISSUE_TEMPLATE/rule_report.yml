name: Rule report
description: Report a wrong diagnostic (false positive) or a missing one (false negative).
title: "rule: "
labels: ["rule", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Rules follow the Google Cloud Apigee X documentation. A link to the relevant
        documentation section is required, because samples alone do not prove what Apigee X accepts.

  - type: dropdown
    id: kind
    attributes:
      label: Type
      options:
        - False positive (reported, but valid)
        - False negative (not reported, but invalid)
        - Wrong message, range, or severity
    validations:
      required: true

  - type: input
    id: rule
    attributes:
      label: Rule ID
      description: For example AX105. Leave empty for a missing diagnostic.
      placeholder: "AX105"

  - type: textarea
    id: xml
    attributes:
      label: Minimal XML example
      render: xml
    validations:
      required: true

  - type: input
    id: docs
    attributes:
      label: Google documentation
      description: Link to the section that supports your report.
      placeholder: "https://docs.cloud.google.com/apigee/docs/api-platform/reference/policies/..."
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Behavior in Apigee X
      options:
        - Deploys successfully
        - Deployment fails
        - Not tested
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Additional details
      description: Deployment error messages or anything else that helps.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: The example contains no credentials, keys, or private data.
          required: true
