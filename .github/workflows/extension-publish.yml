name: Publish VS Code extension

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && vars.EXTENSION_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run release:check
      - run: npm test
      - name: Install a virtual display
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - run: xvfb-run -a npm run test:integration
      # One VSIX is packaged once and published unchanged to both registries; reruns skip existing versions.
      - run: npx vsce package --no-dependencies --pre-release --out apigee-x-linter.vsix
      - name: Publish to the Visual Studio Marketplace
        run: npx vsce publish --packagePath apigee-x-linter.vsix --pre-release --skip-duplicate
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publish to Open VSX
        run: npx --yes ovsx@1.2.0 publish --packagePath apigee-x-linter.vsix --pre-release --skip-duplicate
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
