name: Publish npm package

on:
  workflow_dispatch:

# Trusted publishing exchanges the GitHub OIDC token for a short-lived npm credential; no npm token is stored.
permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Require npm 11.5.1 or later for trusted publishing
        run: node -e "const [a,b,c]=process.argv[1].split('.').map(Number); if (a<11 || a===11 && (b<5 || b===5 && c<1)) { console.error('::error::npm ' + process.argv[1] + ' is too old for trusted publishing.'); process.exit(1); }" "$(npm --version)"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run package:npm
      - run: npm publish .cache/npm-package
