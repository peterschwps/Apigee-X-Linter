name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Match the tag to the package version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Run this workflow on the tag v$version, not on $GITHUB_REF_NAME."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm run check
      - run: npm run release:check
      - run: npm test
      - name: Install a virtual display
        run: command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
      - run: xvfb-run -a npm run test:integration
      # Every store receives these exact files, so all channels ship identical builds.
      - name: Package the extension and the CLI
        run: |
          mkdir -p release
          npx vsce package --no-dependencies --pre-release --out "release/apigee-x-linter-${{ steps.version.outputs.version }}.vsix"
          npm run package:npm
          npm pack ./.cache/npm-package --pack-destination release
      # Validate the exact publish command before approval; npm reads paths without ./ as GitHub repositories.
      - name: Dry-run the npm publication
        run: npm publish "./release/peterschwps-apigee-x-linter-${{ steps.version.outputs.version }}.tgz" --access public --dry-run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error

  publish-marketplace:
    name: Publish to the Visual Studio Marketplace
    needs: build
    if: vars.MARKETPLACE_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://marketplace.visualstudio.com/items?itemName=peterschwps.apigee-x-linter
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Publish with trusted publishing
        run: npx --yes @vscode/vsce@4.0.0 publish --oidc --pre-release --skip-duplicate --packagePath "release/apigee-x-linter-${{ needs.build.outputs.version }}.vsix"

  publish-openvsx:
    name: Publish to Open VSX
    needs: build
    if: vars.OPENVSX_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://open-vsx.org/extension/peterschwps/apigee-x-linter
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Publish with trusted publishing
        run: npx --yes ovsx@1.2.0 publish --trusted-publishing --pre-release --skip-duplicate --packagePath "release/apigee-x-linter-${{ needs.build.outputs.version }}.vsix"

  publish-npm:
    name: Publish to npm
    needs: build
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://www.npmjs.com/package/@peterschwps/apigee-x-linter
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Require npm 11.5.1 or later for trusted publishing
        run: node -e "const [a,b,c]=process.argv[1].split('.').map(Number); if (a<11 || a===11 && (b<5 || b===5 && c<1)) { console.error('::error::npm ' + process.argv[1] + ' is too old for trusted publishing.'); process.exit(1); }" "$(npm --version)"
      - name: Publish with trusted publishing
        run: npm publish "./release/peterschwps-apigee-x-linter-${{ needs.build.outputs.version }}.tgz" --access public

  github-assets:
    name: Attach the VSIX to the GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - run: gh release upload "$GITHUB_REF_NAME" "release/apigee-x-linter-${{ needs.build.outputs.version }}.vsix" --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
